<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>김민수 이력서 · 로봇 S/W 개발자</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="김민수 이력서 · 로봇 S/W 개발자" />
  <meta property="og:description" content="79대 양산 AMR 필드 경험 · ROS 2 · C++17 자율주행 · 엣지 AI 엔지니어 이력서" />
  <meta property="og:image" content="https://kimminsu0519.github.io/resume/assets/og_resume.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://kimminsu0519.github.io/resume/" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100dvh;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 84px;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .page-card {
      position: relative;
      display: none;
      aspect-ratio: 794 / 1123;
      height: calc(100dvh - 100px);
      max-height: calc(100dvh - 100px);
      max-width: calc(100vw - 32px);
      width: auto;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .page-card.active {
      display: block;
      animation: fadeSlide 0.2s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Transparent clickable hotspots locked inside .page-card */
    .hotspot {
      position: absolute;
      display: block;
      border-radius: 4px;
      background: rgba(29, 95, 167, 0);
      transition: background 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      z-index: 5;
      -webkit-tap-highlight-color: rgba(29, 95, 167, 0.2);
    }
    .hotspot:hover, .hotspot:active {
      background: rgba(29, 95, 167, 0.12);
      box-shadow: 0 0 0 1.5px rgba(29, 95, 167, 0.45);
    }

    /* Side arrows */
    .side-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.72);
      color: #f8fafc;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, opacity 0.2s ease;
      z-index: 40;
    }
    .side-arrow:hover { background: rgba(30, 41, 59, 0.95); }
    .side-arrow:disabled { opacity: 0.18; cursor: not-allowed; }
    .side-arrow.left { left: 18px; }
    .side-arrow.right { right: 18px; }

    /* Bottom Floating HUD */
    .hud {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 50;
      white-space: nowrap;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .hud button, .hud a.hud-btn {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(30, 41, 59, 0.85);
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .hud button:hover, .hud a.hud-btn:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(148, 163, 184, 0.55);
    }
    .hud button:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }
    .hud a.hud-pdf {
      background: #1d5fa7;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .hud a.hud-pdf:hover { background: #2563eb; }
    .hud .counter {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      padding: 0 6px;
      min-width: 42px;
      text-align: center;
    }
    .hud .sep {
      width: 1px;
      height: 16px;
      background: rgba(148, 163, 184, 0.25);
      margin: 0 2px;
    }
    .is-hidden { display: none !important; }

    /* Tap-to-hide HUD immersion mode */
    body.hud-hidden .hud {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
    }
    body.hud-hidden .side-arrow {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .stage { padding: 10px 8px 76px; }
      .page-card {
        width: calc(100vw - 16px);
        height: auto;
        max-height: calc(100dvh - 88px);
      }
      .side-arrow {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }
      .side-arrow.left { left: 8px; }
      .side-arrow.right { right: 8px; }
      .hud {
        bottom: 12px;
        padding: 6px 10px;
        gap: 6px;
      }
      .hud button, .hud a.hud-btn {
        font-size: 12px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage"></main>

  <button type="button" class="side-arrow left" id="sidePrev" aria-label="이전 페이지">‹</button>
  <button type="button" class="side-arrow right" id="sideNext" aria-label="다음 페이지">›</button>

  <nav class="hud" id="hud" aria-label="이력서 탐색">
    <button type="button" id="btnPrev">이전</button>
    <span class="counter" id="counter">1 / 2</span>
    <button type="button" id="btnNext">다음</button>
    <span class="sep" id="fsSep"></span>
    <button type="button" id="btnFullscreen">전체화면</button>
    <span class="sep"></span>
    <a class="hud-btn hud-pdf" href="./assets/김민수_이력서.pdf" download="김민수_이력서.pdf">PDF 다운로드</a>
  </nav>

  <script>
    const PAGES_DATA = [{"index": 0, "img": "./assets/resume_p1.png", "alt": "김민수 이력서 1페이지", "hotspots": [{"label": "GitHub 프로필 열기", "uri": "https://github.com/kimminsu0519", "left": 15.9, "top": 45.691, "width": 18.559, "height": 1.75}, {"label": "포트폴리오 열기", "uri": "https://kimminsu0519.github.io/pf", "left": 15.9, "top": 47.651, "width": 18.557, "height": 1.75}, {"label": "이메일 보내기", "uri": "mailto:ajferhcz153@gmail.com", "left": 15.9, "top": 41.772, "width": 16.795, "height": 1.75}]}, {"index": 1, "img": "./assets/resume_p2.png", "alt": "김민수 이력서 2페이지", "hotspots": [{"label": "LSM Bot GitHub 열기", "uri": "https://github.com/kimminsu0519/LSM_Bot", "left": 7.719, "top": 8.196, "width": 7.518, "height": 1.963}, {"label": "LIBO GitHub 열기", "uri": "https://github.com/kimminsu0519/ros-repo-1", "left": 7.719, "top": 23.073, "width": 4.551, "height": 1.963}]}];

    const stage = document.getElementById('stage');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const sidePrev = document.getElementById('sidePrev');
    const sideNext = document.getElementById('sideNext');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const fsSep = document.getElementById('fsSep');
    const counter = document.getElementById('counter');

    let current = 0;

    // Build page cards + transparent hotspots dynamically from build_resume.py data
    const cards = PAGES_DATA.map((p, idx) => {
      const sec = document.createElement('section');
      sec.className = 'page-card' + (idx === 0 ? ' active' : '');
      sec.dataset.page = String(idx);

      const img = document.createElement('img');
      img.src = p.img;
      img.alt = p.alt || `김민수 이력서 ${idx + 1}페이지`;
      sec.appendChild(img);

      (p.hotspots || []).forEach((h) => {
        const a = document.createElement('a');
        a.className = 'hotspot';
        a.href = h.uri;
        if (!h.uri.startsWith('mailto:')) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        a.title = h.label || h.uri;
        a.setAttribute('aria-label', h.label || h.uri);
        a.style.left = `${h.left}%`;
        a.style.top = `${h.top}%`;
        a.style.width = `${h.width}%`;
        a.style.height = `${h.height}%`;
        sec.appendChild(a);
      });

      stage.appendChild(sec);
      return sec;
    });

    function render() {
      cards.forEach((c, i) => c.classList.toggle('active', i === current));
      counter.textContent = `${current + 1} / ${cards.length}`;
      const prevDis = current === 0;
      const nextDis = current === cards.length - 1;
      btnPrev.disabled = prevDis;
      btnNext.disabled = nextDis;
      sidePrev.disabled = prevDis;
      sideNext.disabled = nextDis;
    }

    function goPrev() { if (current > 0) { current--; render(); } }
    function goNext() { if (current < cards.length - 1) { current++; render(); } }

    btnPrev.addEventListener('click', goPrev);
    btnNext.addEventListener('click', goNext);
    sidePrev.addEventListener('click', goPrev);
    sideNext.addEventListener('click', goNext);

    // Keyboard: Left / Right arrow ONLY (Space intentionally disabled)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goNext();
      else if (e.key === 'ArrowLeft') goPrev();
    });

    // PC-only Fullscreen button: show ONLY when NOT in fullscreen (hidden on mobile & when fullscreen is active)
    const isCoarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const canFullscreen = !isCoarsePointer && Boolean(document.documentElement.requestFullscreen);

    function syncFullscreenButton() {
      const isFs = Boolean(document.fullscreenElement) ||
        (Math.abs(window.innerHeight - screen.height) <= 2 && Math.abs(window.innerWidth - screen.width) <= 2);
      const showBtn = canFullscreen && !isFs;
      btnFullscreen.classList.toggle('is-hidden', !showBtn);
      fsSep.classList.toggle('is-hidden', !showBtn);
    }

    btnFullscreen.addEventListener('click', () => {
      document.documentElement.requestFullscreen?.().catch(() => {});
    });
    document.addEventListener('fullscreenchange', syncFullscreenButton);
    window.addEventListener('resize', syncFullscreenButton);
    syncFullscreenButton();

    // Touch swipe (only single finger & unzoomed) + single tap HUD toggle
    let touchStartX = 0;
    let touchStartY = 0;
    let touchMoved = false;
    let multiTouch = false;

    stage.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) {
        multiTouch = true;
        return;
      }
      multiTouch = false;
      touchMoved = false;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) {
        multiTouch = true;
        return;
      }
      const dx = Math.abs(e.touches[0].clientX - touchStartX);
      const dy = Math.abs(e.touches[0].clientY - touchStartY);
      if (dx > 10 || dy > 10) touchMoved = true;
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      if (multiTouch || e.changedTouches.length !== 1) return;
      const scale = window.visualViewport ? window.visualViewport.scale : 1;
      if (scale > 1.05) return; // Do not swipe pages while pinch-zoomed in

      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        if (dx < 0) goNext();
        else goPrev();
      }
    }, { passive: true });

    // Single tap / click on non-link area toggles HUD visibility
    stage.addEventListener('click', (e) => {
      if (e.target.closest('a.hotspot') || touchMoved) return;
      document.body.classList.toggle('hud-hidden');
    });

    render();
  </script>
</body>
</html>
