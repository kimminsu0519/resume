<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>김민수 이력서 · 로봇 S/W 개발자</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="김민수 이력서 · 로봇 S/W 개발자" />
  <meta property="og:description" content="79대 양산 AMR 필드 경험 · ROS 2 · C++17 자율주행 · 엣지 AI 엔지니어 이력서" />
  <meta property="og:image" content="https://kimminsu0519.github.io/resume/assets/og_resume.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://kimminsu0519.github.io/resume/" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.ppt-view {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    body.overview-mode {
      overflow-y: auto;
      padding: 28px 16px 104px;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 16px 86px;
    }
    body.overview-mode .stage {
      height: auto;
      flex-direction: column;
      gap: 24px;
      padding: 0;
    }

    .page-card {
      position: relative;
      display: none;
      aspect-ratio: 794 / 1123;
      height: calc(100vh - 104px);
      max-height: 100%;
      max-width: calc(100vw - 32px);
      width: auto;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .page-card.active { display: block; }
    body.ppt-view .page-card { display: none; }
    body.ppt-view .page-card.active { display: block; }
    body.overview-mode .page-card {
      display: block;
      height: auto;
      width: min(860px, 100%);
      max-height: none;
      cursor: pointer;
    }
    .page-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Transparent clickable link hotspots */
    .hotspot {
      position: absolute;
      display: block;
      border-radius: 4px;
      background: rgba(29, 95, 167, 0);
      transition: background 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      z-index: 5;
    }
    .hotspot:hover {
      background: rgba(29, 95, 167, 0.12);
      box-shadow: 0 0 0 1.5px rgba(29, 95, 167, 0.45);
    }

    /* Bottom HUD */
    .hud {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 50;
      white-space: nowrap;
    }
    .hud button, .hud a.hud-btn {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(30, 41, 59, 0.85);
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .hud button:hover, .hud a.hud-btn:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(148, 163, 184, 0.55);
    }
    .hud button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .hud a.hud-pdf {
      background: #1d5fa7;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .hud a.hud-pdf:hover {
      background: #2563eb;
    }
    .hud .counter {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      padding: 0 6px;
      min-width: 44px;
      text-align: center;
    }
    .hud .sep {
      width: 1px;
      height: 18px;
      background: rgba(148, 163, 184, 0.25);
      margin: 0 2px;
    }

    @media (max-width: 640px) {
      .hud {
        bottom: 12px;
        padding: 6px 10px;
        gap: 5px;
      }
      .hud button, .hud a.hud-btn {
        font-size: 12px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body class="ppt-view">
  <main class="stage" id="stage">
    <!-- Page 1 -->
    <section class="page-card active" data-page="0">
      <img src="./assets/resume_p1.png" alt="김민수 이력서 1페이지" />
      <a class="hotspot" href="https://github.com/kimminsu0519" target="_blank" rel="noopener noreferrer" title="GitHub 프로필 열기"
         style="left:15.9%; top:45.691%; width:18.559%; height:1.75%;"></a>
      <a class="hotspot" href="https://kimminsu0519.github.io/pf" target="_blank" rel="noopener noreferrer" title="포트폴리오 열기"
         style="left:15.9%; top:47.651%; width:18.557%; height:1.75%;"></a>
      <a class="hotspot" href="mailto:ajferhcz153@gmail.com" title="이메일 보내기"
         style="left:15.9%; top:41.772%; width:16.795%; height:1.75%;"></a>
    </section>

    <!-- Page 2 -->
    <section class="page-card" data-page="1">
      <img src="./assets/resume_p2.png" alt="김민수 이력서 2페이지" />
      <a class="hotspot" href="https://github.com/kimminsu0519/LSM_Bot" target="_blank" rel="noopener noreferrer" title="LSM Bot GitHub 열기"
         style="left:7.719%; top:8.196%; width:7.518%; height:1.963%;"></a>
      <a class="hotspot" href="https://github.com/kimminsu0519/ros-repo-1" target="_blank" rel="noopener noreferrer" title="LIBO GitHub 열기"
         style="left:7.719%; top:23.073%; width:4.551%; height:1.963%;"></a>
    </section>
  </main>

  <nav class="hud" aria-label="이력서 탐색">
    <button type="button" id="btnOverview">모아보기</button>
    <span class="sep"></span>
    <button type="button" id="btnPrev">이전</button>
    <span class="counter" id="counter">1 / 2</span>
    <button type="button" id="btnNext">다음</button>
    <span class="sep"></span>
    <a class="hud-btn hud-pdf" href="./assets/김민수_이력서.pdf" download="김민수_이력서.pdf">PDF 다운로드</a>
  </nav>

  <script>
    const cards = Array.from(document.querySelectorAll('.page-card'));
    const btnOverview = document.getElementById('btnOverview');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const counter = document.getElementById('counter');
    let current = 0;
    let overview = false;

    function render() {
      cards.forEach((c, i) => c.classList.toggle('active', i === current));
      counter.textContent = `${current + 1} / ${cards.length}`;
      btnPrev.disabled = overview || current === 0;
      btnNext.disabled = overview || current === cards.length - 1;
      btnOverview.textContent = overview ? '슬라이드 보기' : '모아보기';
    }

    btnOverview.addEventListener('click', () => {
      overview = !overview;
      document.body.classList.toggle('overview-mode', overview);
      document.body.classList.toggle('ppt-view', !overview);
      window.scrollTo(0, 0);
      render();
    });

    btnPrev.addEventListener('click', () => {
      if (current > 0) { current--; render(); }
    });

    btnNext.addEventListener('click', () => {
      if (current < cards.length - 1) { current++; render(); }
    });

    cards.forEach((c, i) => {
      c.addEventListener('click', (e) => {
        if (overview && !e.target.closest('a.hotspot')) {
          overview = false;
          current = i;
          document.body.classList.remove('overview-mode');
          document.body.classList.add('ppt-view');
          window.scrollTo(0, 0);
          render();
        }
      });
    });

    window.addEventListener('keydown', (e) => {
      if (overview) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        if (current < cards.length - 1) { current++; render(); }
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (current > 0) { current--; render(); }
      }
    });

    render();
  </script>
</body>
</html>
