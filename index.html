<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>김민수 이력서 · 로봇 S/W 개발자</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="김민수 이력서 · 로봇 S/W 개발자" />
  <meta property="og:description" content="79대 양산 AMR 필드 경험 · ROS 2 · C++17 자율주행 · 엣지 AI 엔지니어 이력서" />
  <meta property="og:image" content="https://kimminsu0519.github.io/resume/assets/og_resume.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://kimminsu0519.github.io/resume/" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000000;
      color: #f8fafc;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Full-bleed viewport stage (zero padding) */
    .stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      cursor: default;
    }
    .stage.is-zoomed { cursor: grab; }
    .stage.is-dragging { cursor: grabbing; }

    /* Transform layer: zooms ONLY the resume + its % hotspots (HUD never scales) */
    .zoom-layer {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
      transition: transform 0.08s ease-out;
    }
    .zoom-layer.no-transition { transition: none; }

    .page-card {
      position: relative;
      display: none;
      aspect-ratio: 794 / 1123;
      height: 100dvh;
      max-height: 100dvh;
      max-width: 100vw;
      width: auto;
      background: #ffffff;
      border-radius: 0;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    .page-card.active {
      display: block;
      animation: fadeSlide 0.18s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .page-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* Transparent clickable hotspots locked inside .page-card */
    .hotspot {
      position: absolute;
      display: block;
      border-radius: 4px;
      background: rgba(29, 95, 167, 0);
      transition: background 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      z-index: 5;
      -webkit-tap-highlight-color: rgba(29, 95, 167, 0.2);
    }
    .hotspot:hover, .hotspot:active {
      background: rgba(29, 95, 167, 0.12);
      box-shadow: 0 0 0 1.5px rgba(29, 95, 167, 0.45);
    }

    /* Side arrows (auto-hide with HUD, subtle dark ghost style) */
    .side-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(18, 18, 20, 0.55);
      backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.6);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      z-index: 40;
    }
    .side-arrow:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }
    .side-arrow:disabled { opacity: 0.12; cursor: not-allowed; }
    .side-arrow.left { left: 18px; }
    .side-arrow.right { right: 18px; }

    /* Subtle dark-blended auto-hiding HUD */
    .hud {
      position: fixed;
      bottom: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      background: rgba(16, 16, 18, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      z-index: 50;
      white-space: nowrap;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .hud button, .hud a.hud-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.64);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .hud button:hover, .hud a.hud-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.32);
      color: #ffffff;
    }
    .hud button:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .hud a.hud-pdf {
      color: rgba(255, 255, 255, 0.72);
    }
    .hud .sep {
      width: 1px;
      height: 13px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 1px;
    }
    .is-hidden { display: none !important; }

    /* Auto-hidden state: 100% unobstructed view */
    body.ui-idle .hud {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }
    body.ui-idle .side-arrow {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .stage { padding: 0; }
      .page-card {
        width: 100vw;
        height: auto;
        max-height: 100dvh;
      }
      .hud {
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
      }
      body.ui-idle .hud {
        transform: translate(-50%, 8px);
      }
      .side-arrow {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }
      .side-arrow.left { left: 8px; }
      .side-arrow.right { right: 8px; }
    }
  </style>
</head>
<body class="ui-idle">
  <main class="stage" id="stage">
    <div class="zoom-layer" id="zoomLayer"></div>
  </main>

  <button type="button" class="side-arrow left" id="sidePrev" aria-label="이전 페이지">‹</button>
  <button type="button" class="side-arrow right" id="sideNext" aria-label="다음 페이지">›</button>

  <nav class="hud" id="hud" aria-label="이력서 도구">
    <button type="button" id="btnFullscreen" title="전체화면">전체화면</button>
    <span class="sep" id="fsSep"></span>
    <a class="hud-btn hud-pdf" id="btnPdf" href="./assets/김민수_이력서ver3.pdf" download="김민수_이력서ver3.pdf">PDF 다운로드</a>
  </nav>

  <script>
    const PAGES_DATA = [{"index": 0, "img": "./assets/resume_p1.png", "alt": "김민수 이력서 1페이지", "hotspots": [{"label": "GitHub 프로필 열기", "uri": "https://github.com/kimminsu0519", "left": 15.9, "top": 45.691, "width": 18.559, "height": 1.75}, {"label": "포트폴리오 열기", "uri": "https://kimminsu0519.github.io/pf", "left": 15.9, "top": 47.651, "width": 18.557, "height": 1.75}, {"label": "이메일 보내기", "uri": "mailto:ajferhcz153@gmail.com", "left": 15.9, "top": 41.772, "width": 16.795, "height": 1.75}]}, {"index": 1, "img": "./assets/resume_p2.png", "alt": "김민수 이력서 2페이지", "hotspots": [{"label": "LSM Bot GitHub 열기", "uri": "https://github.com/kimminsu0519/LSM_Bot", "left": 7.719, "top": 8.196, "width": 7.518, "height": 1.963}, {"label": "LIBO GitHub 열기", "uri": "https://github.com/kimminsu0519/ros-repo-1", "left": 7.719, "top": 23.073, "width": 4.551, "height": 1.963}]}];

    const stage = document.getElementById('stage');
    const zoomLayer = document.getElementById('zoomLayer');
    const hud = document.getElementById('hud');
    const sidePrev = document.getElementById('sidePrev');
    const sideNext = document.getElementById('sideNext');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const fsSep = document.getElementById('fsSep');
    const btnPdf = document.getElementById('btnPdf');

    let current = 0;
    let scale = 1;
    let tx = 0;
    let ty = 0;
    const MIN_SCALE = 1;
    const MAX_SCALE = 3.5;

    // Build page cards + hotspots inside zoomLayer
    const cards = PAGES_DATA.map((p, idx) => {
      const sec = document.createElement('section');
      sec.className = 'page-card' + (idx === 0 ? ' active' : '');
      sec.dataset.page = String(idx);

      const img = document.createElement('img');
      img.src = p.img;
      img.alt = p.alt || `김민수 이력서 ${idx + 1}페이지`;
      sec.appendChild(img);

      (p.hotspots || []).forEach((h) => {
        const a = document.createElement('a');
        a.className = 'hotspot';
        a.href = h.uri;
        if (!h.uri.startsWith('mailto:')) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        a.title = h.label || h.uri;
        a.setAttribute('aria-label', h.label || h.uri);
        a.style.left = `${h.left}%`;
        a.style.top = `${h.top}%`;
        a.style.width = `${h.width}%`;
        a.style.height = `${h.height}%`;
        sec.appendChild(a);
      });

      zoomLayer.appendChild(sec);
      return sec;
    });

    function clampPan() {
      if (scale <= 1) { tx = 0; ty = 0; return; }
      const active = cards[current];
      const scaledW = active.offsetWidth * scale;
      const scaledH = active.offsetHeight * scale;
      const maxX = Math.max(0, (scaledW - window.innerWidth) / 2);
      const maxY = Math.max(0, (scaledH - window.innerHeight) / 2);
      tx = Math.max(-maxX, Math.min(maxX, tx));
      ty = Math.max(-maxY, Math.min(maxY, ty));
    }

    function applyTransform(instant = false) {
      clampPan();
      zoomLayer.classList.toggle('no-transition', instant);
      zoomLayer.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
      stage.classList.toggle('is-zoomed', scale > 1.01);
    }

    function resetZoom() {
      scale = 1; tx = 0; ty = 0;
      applyTransform(false);
    }

    function render() {
      cards.forEach((c, i) => c.classList.toggle('active', i === current));
      sidePrev.disabled = current === 0;
      sideNext.disabled = current === cards.length - 1;
      resetZoom();
    }

    function goPrev() { if (current > 0) { current--; render(); } }
    function goNext() { if (current < cards.length - 1) { current++; render(); } }

    sidePrev.addEventListener('click', (e) => { e.stopPropagation(); goPrev(); });
    sideNext.addEventListener('click', (e) => { e.stopPropagation(); goNext(); });

    btnPdf.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!window.confirm('김민수_이력서ver3.pdf 파일을 다운로드하시겠습니까?')) {
        e.preventDefault();
      }
    });

    // Keyboard: Left / Right arrows ONLY (Space disabled), Ctrl+0 resets zoom
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goNext();
      else if (e.key === 'ArrowLeft') goPrev();
      else if ((e.ctrlKey || e.metaKey) && e.key === '0') {
        e.preventDefault();
        resetZoom();
      }
    });

    // PC Ctrl + Wheel zooms ONLY the resume canvas (HUD stays crisp & fixed)
    window.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
        applyTransform(false);
      } else if (scale > 1.01) {
        e.preventDefault();
        tx -= e.deltaX;
        ty -= e.deltaY;
        applyTransform(true);
      }
    }, { passive: false });

    // PC Mouse drag-to-pan when zoomed
    let mouseDragging = false;
    let dragStartX = 0, dragStartY = 0, startTx = 0, startTy = 0;
    let didDrag = false;

    stage.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || scale <= 1.01 || e.target.closest('a.hotspot')) return;
      mouseDragging = true;
      didDrag = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      startTx = tx;
      startTy = ty;
      stage.classList.add('is-dragging');
    });

    window.addEventListener('mousemove', (e) => {
      if (!mouseDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) didDrag = true;
      tx = startTx + dx;
      ty = startTy + dy;
      applyTransform(true);
    });

    window.addEventListener('mouseup', () => {
      if (!mouseDragging) return;
      mouseDragging = false;
      stage.classList.remove('is-dragging');
    });

    // PC Double-click to toggle 1x <-> 2x zoom
    stage.addEventListener('dblclick', (e) => {
      if (e.target.closest('a.hotspot')) return;
      if (scale > 1.05) resetZoom();
      else { scale = 2; applyTransform(false); }
    });

    // Google Slides style Auto-Hide HUD on PC (mouse move shows, 2s idle hides)
    const isCoarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    let idleTimer = null;
    let hoveringHud = false;

    function showHudTemporarily() {
      document.body.classList.remove('ui-idle');
      clearTimeout(idleTimer);
      if (!isCoarsePointer && !hoveringHud) {
        idleTimer = setTimeout(() => {
          if (!hoveringHud) document.body.classList.add('ui-idle');
        }, 2000);
      }
    }

    if (!isCoarsePointer) {
      window.addEventListener('mousemove', showHudTemporarily, { passive: true });
      hud.addEventListener('mouseenter', () => { hoveringHud = true; clearTimeout(idleTimer); });
      hud.addEventListener('mouseleave', () => { hoveringHud = false; showHudTemporarily(); });
      [sidePrev, sideNext].forEach((b) => {
        b.addEventListener('mouseenter', () => { hoveringHud = true; clearTimeout(idleTimer); });
        b.addEventListener('mouseleave', () => { hoveringHud = false; showHudTemporarily(); });
      });
      showHudTemporarily();
    }

    // Fullscreen button on any browser supporting Fullscreen API (PC + Android Chrome, etc.)
    const canFullscreen = Boolean((document.fullscreenEnabled ?? true) && document.documentElement.requestFullscreen);
    function syncFullscreenButton() {
      const isFs = Boolean(document.fullscreenElement) ||
        (Math.abs(window.innerHeight - screen.height) <= 2 && Math.abs(window.innerWidth - screen.width) <= 2);
      const showBtn = canFullscreen && !isFs;
      btnFullscreen.classList.toggle('is-hidden', !showBtn);
      fsSep.classList.toggle('is-hidden', !showBtn);
    }
    btnFullscreen.addEventListener('click', (e) => {
      e.stopPropagation();
      document.documentElement.requestFullscreen?.().catch(() => {});
    });
    document.addEventListener('fullscreenchange', syncFullscreenButton);
    window.addEventListener('resize', syncFullscreenButton);
    syncFullscreenButton();

    // Mobile Touch: Pinch-to-Zoom + Pan + Swipe + Double-Tap Zoom + Single-Tap HUD toggle
    let pinchStartDist = 0, pinchStartScale = 1;
    let tStartX = 0, tStartY = 0, tStartTx = 0, tStartTy = 0;
    let tMoved = false, wasPinch = false;
    let lastTapTime = 0;

    function getTouchDist(touches) {
      return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    }

    stage.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        wasPinch = true;
        pinchStartDist = getTouchDist(e.touches);
        pinchStartScale = scale;
      } else if (e.touches.length === 1) {
        wasPinch = false;
        tMoved = false;
        tStartX = e.touches[0].clientX;
        tStartY = e.touches[0].clientY;
        tStartTx = tx;
        tStartTy = ty;
      }
    }, { passive: true });

    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = getTouchDist(e.touches);
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale * (dist / pinchStartDist)));
        applyTransform(true);
      } else if (e.touches.length === 1 && !wasPinch) {
        const dx = e.touches[0].clientX - tStartX;
        const dy = e.touches[0].clientY - tStartY;
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) tMoved = true;
        if (scale > 1.02) {
          e.preventDefault();
          tx = tStartTx + dx;
          ty = tStartTy + dy;
          applyTransform(true);
        }
      }
    }, { passive: false });

    stage.addEventListener('touchend', (e) => {
      if (wasPinch) {
        if (e.touches.length === 0) wasPinch = false;
        if (scale < 1.05) resetZoom();
        return;
      }
      if (e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - tStartX;
      const dy = e.changedTouches[0].clientY - tStartY;

      if (scale <= 1.02 && Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        if (dx < 0) goNext();
        else goPrev();
        return;
      }

      // Single vs Double tap on mobile
      if (!tMoved && !e.target.closest('a.hotspot')) {
        const now = Date.now();
        if (now - lastTapTime < 280) {
          if (scale > 1.05) resetZoom();
          else { scale = 2; applyTransform(false); }
          lastTapTime = 0;
        } else {
          lastTapTime = now;
          setTimeout(() => {
            if (lastTapTime === now) {
              document.body.classList.toggle('ui-idle');
            }
          }, 290);
        }
      }
    }, { passive: true });

    render();
  </script>
</body>
</html>
